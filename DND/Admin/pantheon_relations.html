.rel-name { font-weight: 500; color: var(--color-text-primary); }

    lore: "It is said that Velkros was there when the first word was spoken, and has been listening ever since. His greatest temple is a place mortals cannot reach — a vast archive existing outside of time, where every thought ever thought is preserved. He does not share freely. Knowledge is a treasure, and treasures require proper tribute.",
    relations: [
      { god: "Nyrissa", type: "deep-collaboration", color: "#D4537E", desc: "Fate needs memory to mean anything. Nyrissa tells Velkros which histories will matter; he ensures they are not lost before they are needed." },
      { god: "Sehanine Moonbow", type: "collegial-mystery", color: "#534AB7", desc: "Both guard things from being found. But Sehanine hides to protect; Velkros archives to preserve. Their methods overlap but their motives differ." },
      { god: "Moradin", type: "scholarly-friction", color: "#3B6D11", desc: "Moradin builds what endures physically; Velkros preserves what endures conceptually. The dwarven tradition of oral history is the point where they agree most." },
      { god: "St. Gaed", type: "complex-kinship", color: "#BA7517", desc: "Gaed reveals hidden truths; Velkros archives all truths. They serve the same subject from opposite ends. Gaed tears knowledge into the open; Velkros holds it quietly in trust." }
    ]
  }
];

const CATEGORIES = ["All", "Chaos & Order", "Life & Death", "Fortune", "Mysteries", "Creation", "Knowledge"];
const CAT_MAP = {
  "Chaos & Order": ["panzuriel","primus"],
  "Life & Death": ["myrkul","bahamut","moradin"],
  "Fortune": ["tymora","beshaba","nyrissa"],
  "Mysteries": ["sehanine","stgaed","velkros"],
  "Creation": ["asgorath","melora","moradin"]
};

let activeFilter = "All";
let selectedId = null;

function getTagStyle(domain) {
  const palettes = [
    { bg: "#EEEDFE", color: "#3C3489" },
    { bg: "#E1F5EE", color: "#085041" },
    { bg: "#FAECE7", color: "#712B13" },
    { bg: "#E6F1FB", color: "#0C447C" },
    { bg: "#EAF3DE", color: "#27500A" },
    { bg: "#FAEEDA", color: "#633806" },
  ];
  const i = (domain.charCodeAt(0) + domain.charCodeAt(domain.length-1)) % palettes.length;
  return `background:${palettes[i].bg};color:${palettes[i].color};`;
}

function renderFilters() {
  const bar = document.getElementById("filter-bar");
  bar.innerHTML = CATEGORIES.map(c =>
    `<button class="filter-btn${activeFilter===c?' active':''}" onclick="setFilter('${c}')">${c}</button>`
  ).join("");
}

function setFilter(cat) {
  activeFilter = cat;
  selectedId = null;
  document.getElementById("detail-panel").classList.remove("open");
  renderFilters();
  renderGrid();
}

function visibleIds() {
  if (activeFilter === "All") return GODS.map(g=>g.id);
  return CAT_MAP[activeFilter] || GODS.map(g=>g.id);
}

function renderGrid() {
  const visible = visibleIds();
  const grid = document.getElementById("god-grid");
  grid.innerHTML = GODS.filter(g => visible.includes(g.id)).map(g => `
    <div class="god-card${selectedId===g.id?' selected':''}" onclick="selectGod('${g.id}')">
      <div class="card-header">
        <div class="god-icon" style="background:${g.bg}">${g.icon}</div>
        <div>
          <div class="god-name">${g.name}</div>
          <div class="god-title">${g.title}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="domains">
          ${g.domains.slice(0,4).map(d=>`<span class="domain-tag" style="${getTagStyle(d)}">${d}</span>`).join("")}
          ${g.domains.length>4?`<span class="domain-tag" style="background:var(--color-background-secondary);color:var(--color-text-tertiary)">+${g.domains.length-4}</span>`:""}
        </div>
        <div class="desc">${g.desc.substring(0,130)}…</div>
      </div>
      <div class="relations-section">
        <div class="rel-label">Key relations</div>
        <div class="rel-list">
          ${g.relations.slice(0,2).map(r=>`
            <div class="rel-item">
              <div class="rel-dot" style="background:${r.color}"></div>
              <div><span class="rel-name">${r.god}</span> — ${r.desc.substring(0,70)}…</div>
            </div>`).join("")}
        </div>
      </div>
    </div>
  `).join("");
}

function selectGod(id) {
  if (selectedId === id) {
    selectedId = null;
    document.getElementById("detail-panel").classList.remove("open");
    renderGrid();
    return;
  }
  selectedId = id;
  renderGrid();
  renderDetail(id);
  setTimeout(()=>document.getElementById("detail-panel").scrollIntoView({behavior:"smooth",block:"nearest"}),100);
}

function renderDetail(id) {
  const g = GODS.find(x=>x.id===id);
  const panel = document.getElementById("detail-panel");
  panel.classList.add("open");
  panel.innerHTML = `
    <button class="close-btn" onclick="selectGod('${id}')">✕ close</button>
    <div class="detail-name">${g.icon} ${g.name}</div>
    <div class="detail-role">${g.role} · ${g.title}</div>
    <div class="detail-domains">
      ${g.domains.map(d=>`<span class="domain-tag" style="${getTagStyle(d)}">${d}</span>`).join("")}
    </div>
    <div class="detail-desc">${g.desc}</div>
    <div class="detail-lore">${g.lore}</div>
    <div class="rel-label" style="margin-bottom:8px">Divine relations</div>
    <div class="rel-grid">
      ${g.relations.map(r=>`
        <div class="rel-card" style="cursor:pointer" onclick="selectGod('${GODS.find(x=>x.name===r.god||x.name.startsWith(r.god.split(' ')[0]))?.id}')">
          <div class="rel-type" style="color:${r.color}">${r.type.replace(/-/g,' ')}</div>
          <div class="rel-name" style="margin-bottom:3px;font-size:13px">${r.god}</div>
          <div class="rel-desc">${r.desc}</div>
        </div>`).join("")}
    </div>
  `;
}

renderFilters();
renderGrid();
</script>
